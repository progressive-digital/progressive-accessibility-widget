name: Library quality

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sienna-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high
